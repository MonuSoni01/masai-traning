<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Signup (OOPS Example)</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      padding: 40px;
    }
    .box {
      width: 300px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      margin: auto;
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #aaa;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #message {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Signup Form</h2>

    <input id="un" type="text" placeholder="Enter Username">
    <input id="pw" type="password" placeholder="Enter Password">

    <button onclick="doSignup()">Sign Up</button>

    <div id="message"></div>
  </div>

  <script src="main.js"></script>

</body>
</html>
