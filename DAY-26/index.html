<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Search UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* Search Box Style */
        #query {
            width: 70%;
            padding: 12px 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        input[type="submit"] {
            padding: 12px 20px;
            border: none;
            background: #ff0000;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        input[type="submit"]:hover {
            background: #cc0000;
        }

        /* Results Grid */
        #result {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        /* Video Card */
        #result div {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
            transition: 0.3s ease;
        }

        #result div:hover {
            transform: translateY(-5px);
        }

        iframe {
            width: 100%;
            height: 200px;
            border-radius: 8px;
        }

        h3 {
            margin-top: 10px;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" placeholder="Search..." id="query">
        <input type="submit" value="Search" onclick="getSearch()">

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
