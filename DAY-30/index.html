<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-box {
            width: 360px;
            background: #ffffff;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .weather-box h1 {
            margin-bottom: 20px;
            color: #222;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .search-box button {
            padding: 12px 16px;
            border: none;
            background: #007bff;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #0056b3;
        }

        .weather-result {
            margin-top: 25px;
        }

        .weather-result h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .weather-result img {
            width: 80px;
        }

        .weather-result p {
            margin: 8px 0;
            color: #444;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="weather-box">
        <h1>Weather App</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name" />
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherResult" class="weather-result">
            <p>Search city weather here...</p>
        </div>
    </div>

    <script>
        const apiKey = "33e9227121de7e92447976012a475da1";

        async function getWeather() {
            const city = document.getElementById("cityInput").value.trim();
            const resultBox = document.getElementById("weatherResult");

            if (!city) {
                resultBox.innerHTML = "<p>Please enter a city name.</p>";
                return;
            }

            resultBox.innerHTML = "<p>Loading weather data...</p>";

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`
                );

                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();

                resultBox.innerHTML = `
            <h2>${data.name}, ${data.sys.country}</h2>
            
            <img 
                src="https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png"
                alt="${data.weather[0].description}"
            >

            <p><strong>Temperature:</strong> ${Math.round(data.main.temp)}°C</p>
            <p><strong>Feels Like:</strong> ${Math.round(data.main.feels_like)}°C</p>
            <p><strong>Condition:</strong> ${data.weather[0].main}</p>
            <p><strong>Description:</strong> ${data.weather[0].description}</p>
            <p><strong>Humidity:</strong> ${data.main.humidity}%</p>
            <p><strong>Wind Speed:</strong> ${data.wind.speed} m/s</p>
            <p><strong>Pressure:</strong> ${data.main.pressure} hPa</p>
        `;
            } catch (error) {
                resultBox.innerHTML = `
            <p style="color:red;">
                Unable to fetch weather data. Please check city name.
            </p>
        `;
                console.error(error);
            }
        } </script>
</body>

</html>
