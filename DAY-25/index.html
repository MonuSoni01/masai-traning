<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Wars Search</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        #results p {
            padding: 6px;
            background: #f3f3f3;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h2>Star Wars Character Search</h2>

    <input 
        type="text" 
        id="query" 
        placeholder="Search character..."
        oninput="debouncing(main, 600)"
    />

    <div id="results"></div>

    <script src="script.js"></script>

</body>
</html>
